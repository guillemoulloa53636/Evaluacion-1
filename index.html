<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Viajes por Chile</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Menú de Navegación Unificado -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: #0a2540;">
        <div class="container-fluid px-4">
            
            <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
                <img src="Img/Buses.png" alt="Logo Viajes por Chile" width="80" height="80" class="me-2">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto d-flex align-items-center gap-3">

                    <li class="nav-item d-flex align-items-center gap-2">
                        <img src="Img/cropped_circle_image.png" alt="Icono usuario" width="40" height="40" class="rounded-circle">
                        <a class="btn btn-turquesa rounded-1 px-3 fw-semibold text-white active" href="index.html">
                            Mi cuenta
                        </a>
                    </li>

                    <li class="nav-item d-flex align-items-center gap-2">
                        <a class="btn btn-turquesa rounded-1 px-3 fw-semibold text-white" href="registro.html">
                            Registrarse
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa rounded-1 px-3 fw-semibold text-white" href="servicio.html">
                            <i class="bi bi-headset me-1"></i> Servicio al cliente
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="blog.html" class="btn btn-turquesa rounded-1 px-3 fw-semibold text-white">
                            <i class="bi bi-journal-text me-1"></i> Blog
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container d-flex justify-content-center align-items-center py-5 flex-grow-1">
        
        <div class="card shadow-lg p-4 rounded-4 border-0" style="width: 100%; max-width: 420px;">
            
            <div class="text-center mb-4">
                <i class="bi bi-person-circle text-secondary" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mt-2" style="color: #0a2540;">Iniciar Sesión</h3>
                <p class="text-muted small">Ingresa tus datos para gestionar tus pasajes</p>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="rutOEmail" class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                    <input type="text" class="form-control py-2" id="rutOEmail" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-secondary">Contraseña</label>
                    <input type="password" class="form-control py-2" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="recordarme">
                        <label class="form-check-label text-muted" for="recordarme">Recordarme</label>
                    </div>
                    <a href="#" class="text-decoration-none fw-semibold" style="color: #0a2540;">¿Olvidaste tu clave?</a>
                </div>

                <button type="submit" class="btn w-100 fw-bold text-white py-2 mb-3 shadow-sm" style="background-color: #0a2540; border-radius: 8px;">
                    Ingresar a mi cuenta
                </button>

                <!-- Mensaje de error único controlado por JS -->
                <div id="errorMensaje" class="alert alert-danger d-none p-2 small text-center" role="alert"></div>

                <div class="text-center mt-3">
                    <span class="text-muted small">¿No tienes una cuenta?</span>
                    <a href="registro.html" class="text-decoration-none fw-bold" style="color: #b91313;">Regístrate aquí</a>
                </div>
            </form>
            
        </div>
        
    </main>

    <!-- Pie de Página (Footer) Unificado -->
    <footer class="mt-auto py-3 text-center text-white" style="background-color: #0a2540;">
        <div class="container">
            <p class="mb-1 small">&copy; Viajes por Chile. Todos los derechos reservados.</p>
            <div class="d-flex justify-content-center gap-3 fs-5">
                <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Script principal de JS -->
    <script src="main.js"></script>
</body>
</html>
