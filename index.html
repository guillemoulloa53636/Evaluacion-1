<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Viajes por Chile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: #0a2540;">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand d-flex align-items-center fw-bold me-0" href="Menu.html">
                    <img src="Img/Buses.png" alt="logo viajes por chile" width="50" height="50" class="me-2">
                    <span>Viajes por chile<small class="text-white-50 fs-6">.cl</small></span>
                </a>
                <a href="Menu.html" class="btn btn-outline-light btn-sm ms-2">Volver al inicio</a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Navegación de paleta">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a href="nosotros.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-people me-1"></i> Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="blog.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-journal-text me-1"></i> Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="servicio.html">
                            <i class="bi bi-headset me-1"></i> Servicio al cliente
                        </a>
                    </li>

                    <li class="nav-item d-flex align-items-center gap-2">
                        <img src="Img/cropped_circle_image.png" alt="Perfil de usuario" width="40" height="40" class="rounded-circle border border-light">
                        <a class="btn btn-turquesa text-white fw-semibold active" href="#" onclick="irAMiCuenta(event)">Mi cuenta</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="registro.html">Registrarse</a>
                    </li>

                    <li class="nav-item">
                        <button type="button" class="btn btn-light position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito" onclick="renderizarCarrito()" aria-label="Ver carrito de compras">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario de Iniciar Sesión (Login) -->
    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle display-4 text-primary"></i>
                            <h2 class="fw-bold text-dark mt-2">Iniciar Sesión</h2>
                            <p class="text-muted small">Ingresa a tu cuenta para gestionar tus pasajes</p>
                        </div>

                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="loginPassword" class="form-label fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn text-white fw-semibold w-100 py-2 mt-3" style="background-color: #0a2540;">
                                Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="small text-muted mb-0">¿No tienes una cuenta aún?</p>
                            <a href="registro.html" class="fw-bold text-decoration-none">Regístrate aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Carrito de Compras -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCarritoLabel"><i class="bi bi-cart3 me-2"></i>Mi carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="listaCarrito"></div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" id="btnVaciarCarrito" class="btn btn-outline-danger">Vaciar carrito</button>
                    <strong>Total: <span id="totalCarrito" class="text-success">$0</span></strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="mt-auto py-3 text-center text-white" style="background-color: #0a2540;">
        <div class="container">
            <p class="mb-1 small">&copy; Viajes por Chile. Todos los derechos reservados.</p>
            <div class="d-flex justify-content-center gap-3 fs-5">
                <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
