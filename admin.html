<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Viajes por Chile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: #0a2540;">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand d-flex align-items-center fw-bold me-0" href="Menu.html">
                    <img src="Img/Buses.png" alt="logo viajes por chile" width="50" height="50" class="me-2">
                    <span>Viajes por chile<small class="text-white-50 fs-6">.cl</small></span>
                </a>
                <a href="Menu.html" class="btn btn-outline-light btn-sm ms-2">Volver al inicio</a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a href="nosotros.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-people me-1"></i> Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="blog.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-journal-text me-1"></i> Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="servicio.html">
                            <i class="bi bi-headset me-1"></i> Servicio al cliente
                        </a>
                    </li>

                    <li class="nav-item d-flex align-items-center gap-2">
                        <img src="Img/cropped_circle_image.png" alt="Perfil de usuario" width="40" height="40" class="rounded-circle border border-light">
                        <a class="btn btn-turquesa text-white fw-semibold active" href="#">Mi cuenta</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="registro.html">Registrarse</a>
                    </li>

                    <li class="nav-item">
                        <button type="button" class="btn btn-light position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito" onclick="renderizarCarrito()" aria-label="Ver carrito de compras">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Panel de Administración -->
    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold text-dark h2">Gestión de Pasajes</h1>
            <button class="btn btn-success fw-semibold" data-bs-toggle="modal" data-bs-target="#modalEditarProducto" onclick="limpiarFormulario()">
                <i class="bi bi-plus-circle me-1"></i> Nuevo Pasaje
            </button>
        </div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Título</th>
                            <th>Precio</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductosAdmin">
                        <!-- Creado dinámicamente desde el JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Agregar / Editar Pasaje -->
    <div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-labelledby="modalEditarProductoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarProductoLabel"><i class="bi bi-plus-lg me-2"></i>Añadir Nuevo Producto / Pasaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="formProductoAdmin" onsubmit="guardarProductoFormulario(event)">
                    <div class="modal-body">
                        <input type="hidden" id="prodSlug">
                        
                        <div class="mb-3">
                            <label for="prodId" class="form-label fw-bold">ID del Producto</label>
                            <input type="text" class="form-control" id="prodId" required readonly>
                        </div>

                        <div class="mb-3">
                            <label for="prodTitle" class="form-label fw-bold">Título / Destino</label>
                            <input type="text" class="form-control" id="prodTitle" placeholder="Ej: Santiago a Puerto Montt" required>
                        </div>

                        <div class="mb-3">
                            <label for="prodPrice" class="form-label fw-bold">Precio ($CLP)</label>
                            <input type="number" class="form-control" id="prodPrice" placeholder="Ej: 25000" required>
                        </div>

                        <div class="mb-3">
                            <label for="prodType" class="form-label fw-bold">Tipo de Asiento</label>
                            <select class="form-select" id="prodType">
                                <option value="Clásico">Clásico</option>
                                <option value="Semi Cama">Semi Cama</option>
                                <option value="Salón Cama">Salón Cama</option>
                                <option value="Premium">Premium</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="prodStatus" class="form-label fw-bold">Estado</label>
                            <select class="form-select" id="prodStatus">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                                <option value="Agotado">Agotado</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="prodImg" class="form-label fw-bold">Ruta de Imagen</label>
                            <input type="text" class="form-control" id="prodImg" value="Img/Buses.png">
                        </div>

                        <div class="mb-3">
                            <label for="prodDesc" class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" id="prodDesc" rows="3" placeholder="Detalles del viaje..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Guardar Pasaje</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Carrito de Compras -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCarritoLabel"><i class="bi bi-cart3 me-2"></i>Mi carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="listaCarrito"></div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" id="btnVaciarCarrito" class="btn btn-outline-danger" onclick="vaciarCarrito()">Vaciar carrito</button>
                    <strong>Total: <span id="totalCarrito" class="text-success">$0</span></strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="mt-auto py-3 text-center text-white" style="background-color: #0a2540;">
        <div class="container">
            <p class="mb-1 small">&copy; Viajes por Chile. Todos los derechos reservados.</p>
            <div class="d-flex justify-content-center gap-3 fs-5">
                <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
