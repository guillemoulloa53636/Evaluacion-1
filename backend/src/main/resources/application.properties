# Escucha en todas las interfaces para ser accesible desde otros dispositivos de la red
server.address=0.0.0.0
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3308/viajes_chile}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Orígenes permitidos separados por coma; configura solo los hosts del frontend.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:clave_secreta_muy_segura_para_viajes_por_chile_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
# Límite de intentos por IP en login, google y recuperación de contraseña.
app.auth.rate-limit.max-attempts=${AUTH_RATE_MAX_ATTEMPTS:10}
app.auth.rate-limit.window-seconds=${AUTH_RATE_WINDOW_SECONDS:300}
app.google.client-id=${GOOGLE_CLIENT_ID:25065180497-5qa2tf845vbhk57gjav0iht24jkre8ft.apps.googleusercontent.com}

# Recuperaci�n de contrase�a por correo. Si MAIL_HOST est� vac�o, el enlace se imprime en el log del backend.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:no-reply@viajesporchile.cl}
app.password-reset.expiration-minutes=${RESET_EXPIRATION_MINUTES:30}
# Para enviar correos reales define SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false
