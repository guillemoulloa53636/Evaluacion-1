# Escucha en todas las interfaces para ser accesible desde otros dispositivos de la red
server.address=0.0.0.0
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3308/viajes_chile}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Orígenes permitidos (separados por coma). "*" permite cualquier origen/dispositivo.
app.cors.allowed-origins=${CORS_ORIGINS:*}
