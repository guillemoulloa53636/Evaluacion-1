<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Viajes por Chile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navegación superior -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: #0a2540;">
        <div class="container-fluid px-4">
            
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-brand d-flex align-items-center fw-bold me-0" href="Menu.html">
                    <img src="Img/Buses.png" alt="Logo Viajes por Chile" width="50" height="50" class="me-2">
                    <span>Viajes por chile<small class="text-white-50 fs-6">.cl</small></span>
                </a>
                <a href="Menu.html" class="btn btn-outline-light btn-sm ms-2">Volver al inicio</a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item">
                        <a href="nosotros.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-people me-1"></i> Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="blog.html" class="btn btn-turquesa text-white fw-semibold">
                            <i class="bi bi-journal-text me-1"></i> Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="servicio.html">
                            <i class="bi bi-headset me-1"></i> Servicio al cliente
                        </a>
                    </li>

                    <li class="nav-item d-flex align-items-center gap-2">
                        <img src="Img/cropped_circle_image.png" alt="Perfil de usuario" width="40" height="40" class="rounded-circle border border-light">
                        <a class="btn btn-turquesa text-white fw-semibold" href="#" onclick="irAMiCuenta(event)">Mi cuenta</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-turquesa text-white fw-semibold" href="registro.html">Registrarse</a>
                    </li>

                    <li class="nav-item">
                        <button type="button" class="btn btn-light position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito" onclick="renderizarCarrito()" aria-label="Ver carrito de compras">
                            <i class="bi bi-cart3 fs-5"></i>
                            <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido del Menú / Buscador de Pasajes -->
    <main class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark">Busca tu pasaje de bus</h1>
            <p class="lead text-muted">Viaja por todo Chile con las mejores tarifas y el mejor confort.</p>
        </div>

        <div class="card shadow-lg border-0 rounded-4 p-4 mb-5">
            <form id="formBuscador" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="origenSelect" class="form-label fw-semibold">Origen</label>
                    <select id="origenSelect" class="form-select" required>
                        <option value="" disabled selected>Selecciona origen</option>
                        <option value="santiago">Santiago</option>
                        <option value="valparaiso">Valparaíso</option>
                        <option value="concepcion">Concepción</option>
                        <option value="arica">Arica</option>
                        <option value="puerto_montt">Puerto Montt</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="destinoSelect" class="form-label fw-semibold">Destino</label>
                    <select id="destinoSelect" class="form-select" required>
                        <option value="" disabled selected>Selecciona destino</option>
                        <option value="santiago">Santiago</option>
                        <option value="valparaiso">Valparaíso</option>
                        <option value="concepcion">Concepción</option>
                        <option value="arica">Arica</option>
                        <option value="puerto_montt">Puerto Montt</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="fechaSelect" class="form-label fw-semibold">Fecha de Viaje</label>
                    <input type="date" id="fechaSelect" class="form-control">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: #0a2540;">
                        <i class="bi bi-search me-1"></i> Buscar
                    </button>
                    <button type="button" class="btn btn-outline-secondary py-2" onclick="location.reload()" title="Restablecer filtros">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Contenedor dinámico de resultados -->
        <div id="resultadosBusqueda" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Los pasajes se renderizan dinámicamente con JavaScript desde main.js -->
        </div>
    </main>

    <!-- Modal de Carrito de Compras -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCarritoLabel"><i class="bi bi-cart3 me-2"></i>Mi carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="listaCarrito"></div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" id="btnVaciarCarrito" class="btn btn-outline-danger">Vaciar carrito</button>
                    <strong>Total: <span id="totalCarrito" class="text-success">$0</span></strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="mt-auto py-3 text-center text-white" style="background-color: #0a2540;">
        <div class="container">
            <p class="mb-1 small">&copy; Viajes por Chile. Todos los derechos reservados.</p>
            <div class="d-flex justify-content-center gap-3 fs-5">
                <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white"><i class="bi bi-twitter-x"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
