<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio al Cliente / Contacto</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
    
   
</head>
<body>

    
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: #0a2540;">
        <div class="container-fluid px-4">
            
            <div class="navbar-brand d-flex align-items-center fw-bold">
                <i class="bi bi-record-circle fs-2 text-info me-2"></i> <!-- Cambié text-turquesa a text-info por si no tienes la clase creada -->
                <img src="Img/Buses.png" alt="logo viajes por chile" width="100" height="100" class="me-3">
                <a href="Menu.html" class="text-white text-decoration-none fs-6">
                    <span>Volver al inicio</span>
                </a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto d-flex align-items-center gap-3">
                    <li class="nav-item d-flex align-items-center gap-2">
                        <img src="Img/cropped_circle_image.png" alt="Icono usuario" width="50" height="50" class="rounded-circle">
                        <a class="btn btn-info rounded-1 px-3 fw-semibold text-white" href="Menu.html">
                            Mi cuenta
                        </a>
                    </li>

                     <li class="nav-item d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle fs-2 text-secondary"></i>
                        <a class="btn btn-info rounded-1 px-3 fw-semibold text-white" href="registro.html">
                            Registrarse
                        </a>
                    </li>

                     <li class="nav-item">
                        <a class="btn btn-info rounded-1 px-3 fw-semibold text-white active" href="servicio.html">
                            <i class="bi bi-headset me-1"></i> Servicio al cliente
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="blog.html" class="btn btn-info rounded-1 px-3 fw-semibold text-white">
                            <i class="bi bi-journal-text me-1"></i> Blog
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    
    <main class="container d-flex justify-content-center align-items-center py-5" style="min-height: 85vh;">
        <div class="card shadow-lg p-4 rounded-4 border-0 service-card">
            <div class="text-center mb-4">
                <div class="service-icon">
                    <i class="bi bi-headset"></i>
                </div>
                <h3 class="fw-bold mb-1" style="color: #0a2540;">Servicio al cliente</h3>
                <p class="text-muted small mb-0">Escríbenos y te responderemos a la brevedad.</p>
            </div>

            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold text-secondary">Nombre Completo</label>
                    <input type="text" class="form-control py-2" id="nombre" placeholder="Ej: Camila Torres" required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label fw-semibold text-secondary">Correo Electrónico</label>
                    <input type="email" class="form-control py-2" id="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="mb-4">
                    <label for="contenido" class="form-label fw-semibold text-secondary">Mensaje</label>
                    <textarea class="form-control py-2" id="contenido" rows="5" placeholder="Cuéntanos tu consulta o problema..." required></textarea>
                </div>

                <button type="submit" class="btn w-100 fw-bold text-white py-2 shadow-sm" style="background-color: #0a2540; border-radius: 8px;">
                    Enviar mensaje
                </button>
            </form>
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
